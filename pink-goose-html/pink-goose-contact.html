<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <link rel="stylesheet" href="../pink-goose-css/pink-goose.css">
</head>

<body>
    <header class="header">
        <h1>Pink <span class="goose-pink">Goose</span></h1>
        <nav class="nav-bar">
            <a href="../index.html" class="nav-text">Home</a>
            <a href="./pink-goose-learn.html" class="nav-text">Learn</a>
            <a href="./pink-goose-about.html" class="nav-text">About</a>
            <a href="./pink-goose-contact.html" class="nav-text">Contact</a>
        </nav>
        <a href="../Pink-Goose/" class="nav-text button">Login</a>
    </header>

    <main>
    <!-- start section for contacts/ telegram & email -->
    <section id="your-idea">
        <h2>What's your GOOSE idea?</h2>
        <h3 class="info-text">Let's chat and see how we can help</h3>

        <div class="idea-blocks">
            <div class="idea-block idea-block-1">
                <img src="../images/group-5531.png" alt="telegram logo">
                <div class="idea-block-text">
                    <h3>Telegram</h3>
                    <p>@superdao_team</p>
                </div>
            </div>
            <div class="idea-block idea-block-2">
                <img src="../images/group-5640.png" alt="email logo">
                <div class="idea-block-text">
                    <h3>Email</h3>
                    <p>hello@supderdao.co</p>
                </div>
            </div>
        </div>
    </section>

    <!-- form to allow people to send simple messages -->
    <section class="send-post">
        <div class="post-block">
            <h2>Send a post Goose</h2>
            <form>
                <input class="input-text contact-input" placeholder="your email" type="email" id="email" name="email"
                    required>
                <input class="input-text contact-input" placeholder="Your name" type="text" id="name" name="your-name" required>
                <textarea class="input-text contact-input" rows="10" placeholder="Your message" id="message-input" name="message-input"></textarea>
                <select class="input-text contact-input" name="color-select">
                    <option value="" disabled selected>Color of your goose</option>
                    <option value="v01">Red</option>
                    <option value="v02">White</option>
                    <option value="v03">Blue</option>
                    <option value="v04">Black</option>
                </select>
                <button class="input-button" type="submit">Send</button>
            </form>
        </div>
    </section>

    </main>
    <footer>
        <div id="footer">
            <div class="footer-nav">
                <a href="./Pinkgoose-html/PinkGoose-About.html">About</a>
                <a href="_blank">Jobs</a>
                <a href="_blank">Legal </a>
            </div>

            <div class="footer-external-contact">
                <a href="_blank">
                    <img src="../images/twitter-logo.png" alt="twitter-logo">
                </a>
                <a href="_blank">
                    <img src="../images/telegram-logo.png" alt="telegram-logo">
                </a>
                <a href="_blank">
                    <img src="../images/youtube-logo.png" alt="youtube-logo">
                </a>
                <a href="_blank">
                    <img src="../images/discord-1.png" alt="discord-logo">
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
