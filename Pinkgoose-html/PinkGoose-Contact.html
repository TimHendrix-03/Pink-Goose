<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <link rel="stylesheet" href="../Pinkgoose-css/PinkGoose.css">
</head>

<body>
    <section class="container">
        <header class="header">
            <h2 class="h2">Pink <span class="goosepink">Goose</span></h2>
            <div class="navbar">
                <a href="../Pinkgoose-html/PinkGoose-Home.html" class="navtext home">Home</a>
                <a href="../Pinkgoose-html/PinkGoose-Learn.html" class="navtext learn">Learn</a>
                <a href="../Pinkgoose-html/PinkGoose-About.html" class="navtext about">About</a>
                <a href="../Pinkgoose-html/PinkGoose-Contact.html" class="navtext contact">Contact</a>
            </div>
            <a href="../Pink-Goose/" class="navtext button">Login</a>
        </header>

        <section id="your-idea">
            <h2>What's your GOOSE idea?</h2>
            <h3>Let's chat and see how we can help</h3>

            <div class="idea-blocks">
                <div class="idea-block idea-block-1">
                    <img src="../images/Group-5531.png" alt="telegram logo">
                    <div class="idea-block-text">
                        <h3>Telegram</h3>
                        <p>@superdao_team</p>
                    </div>
                </div>
                <div class="idea-block idea-block-2">
                    <img src="../images/Group-5640.png" alt="email logo">
                    <div class="idea-block-text">
                        <h3>Email</h3>
                        <p>hello@supderdao.co</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="send-post">
            <div class="post-block">
                <h2>Send a post Goose</h2>
                <form>
                    <input class="input-text contact-input" placeholder="your email" type="email" id="email"
                        name="email" required>
                    <input class="input-text contact-input" placeholder="Your name" type="text" id="name" required>
                    <textarea class="input-text contact-input" rows="10" placeholder="Your message"></textarea>
                    <select class="input-text contact-input" name="color-select">
                        <option value="" disabled selected>Color of your goose</option>
                        <option value="v01">Red</option>
                        <option value="v02">White</option>
                        <option value="v03">Blue</option>
                        <option value="v04">Black</option>
                    </select>
                    <button class="input-button" type="submit">Send</button>
                </form>
            </div>
        </section>

        <footer>
            <div id="footer">
                <div class="footer-nav">
                    <a href="./">About</a>
                    <a href="./">Jobs</a>
                    <a href="./">Legal </a>
                </div>

                <div class="footer-external-contact">
                    <img src="../images/twitter_logo.png" alt="twitter logo">
                    <img src="../images/Telegram_logo.png" alt="telegram logo">
                    <img src="../images/Youtube_logo.png" alt="youtube logo">
                    <img src="../images/discord_1.png" alt="discord logo">
                </div>
            </div>
        </footer>
    </section>
</body>
